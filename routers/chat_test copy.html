<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus Secure Chat</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body id="chatBody" class="bg-slate-900 text-gray-100 min-h-screen flex items-center justify-center p-4 antialiased font-sans relative overflow-hidden">
    <!-- Main Chat UI Container -->
    <div class="glass-panel w-full max-w-4xl h-[85vh] rounded-3xl shadow-2xl flex flex-col relative z-10 overflow-hidden bg-slate-800/50 border border-slate-700">
        
        <!-- Header with Live Presence -->
        <div class="p-6 border-b border-slate-700 flex justify-between items-center bg-slate-900/50">
            <div>
                <h1 class="text-2xl font-bold text-cyan-400 tracking-wider">Nexus Chat</h1>
                <p class="text-xs text-emerald-400 flex items-center gap-2 mt-1">
                    <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span> Server Live
                </p>
            </div>
            
            <!-- Presence Indicator Area -->
            <div id="presenceIndicator" class="flex items-center gap-2 opacity-0 transition-opacity duration-500">
                <span id="presenceDot" class="w-3 h-3 rounded-full bg-emerald-400"></span>
                <span id="presenceText" class="text-sm font-medium text-slate-300"></span>
            </div>
        </div>

        <!-- Messages Area -->
        <div id="messagesContainer" class="flex-1 p-6 overflow-y-auto flex flex-col gap-4">
            <!-- Messages will appear here -->
        </div>

        <!-- Typing Indicator Area -->
        <div class="px-6 py-1 h-6">
            <p id="typingIndicator" class="text-xs text-cyan-400 italic opacity-0 transition-opacity duration-300"></p>
        </div>

        <!-- Input Area with Image Upload -->
        <div class="p-4 bg-black/30 border-t border-white/10 backdrop-blur-md">
            <div class="flex gap-3 max-w-3xl mx-auto">
                
                <!-- Hidden Image Input & Visible Button -->
                <input type="file" id="imageInput" accept="image/*" class="hidden" onchange="sendImage(event)">
                <button onclick="document.getElementById('imageInput').click()" class="px-4 py-3 bg-white/5 border border-white/10 rounded-xl text-cyan-400 hover:text-white hover:bg-cyan-500/20 transition-all shadow-sm" title="Send Image">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                </button>
                
                <input type="text" id="msgInput" onkeypress="handleKeyPress(event)" oninput="sendTypingSignal()" placeholder="Initialize transmission..."
                    class="flex-1 bg-white/5 border border-white/10 rounded-xl px-5 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-cyan-500/50 focus:border-transparent transition-all placeholder-slate-500">
                <button onclick="sendMessage()"
                    class="bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500 text-white px-6 py-3 rounded-xl font-semibold shadow-lg shadow-cyan-500/30 transition-all flex items-center gap-2">
                    <span>Send</span>
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"></path></svg>
                </button>
            </div>
        </div>
    </div>

    <script>
        // ==========================================
        // EKHANE TOMAR NAM AR FRESH TOKEN BOSHABE
        // ==========================================
        const myName = "Kashfi"; 
        const myToken = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiJLYXNoZmkiLCJleHAiOjE3OTQzNTMwMzV9.0JUQealjw-kmJaq5WMagBUU18QKEL0ACmkefFPW9uf8"; 
        
        var ws = new WebSocket(`ws://127.0.0.1:8000/ws/1/${myName}?token=${myToken}`);
        var typingTimeout; 

        // --- 1. SCREENSHOT NINJA DETECTOR ---
        document.addEventListener("keyup", function(e) {
            // Detect PrintScreen key (Windows/Mac) or Windows Snipping Tool (Win + Shift + S)
            if (e.key === "PrintScreen" || e.key === "PrntScrn" || (e.metaKey && e.shiftKey)) {
                ws.send(JSON.stringify({"type": "screenshot"}));
            }
        });

        // --- 2. IMAGE SENDER (Base64) ---
        function sendImage(event) {
            var file = event.target.files[0];
            if (!file) return;
            var reader = new FileReader();
            reader.onload = function(e) {
                // Converting image to long text (base64) and sending as standard chat message
                ws.send(JSON.stringify({"type": "chat", "message": e.target.result}));
            };
            reader.readAsDataURL(file);
            event.target.value = ""; // Reset input
        }

        // --- 3. MESSAGE & IMAGE FORMATTER ---
        function formatMessage(msgContent) {
            // Check if the message is actually a Base64 Image string
            if (msgContent.startsWith("data:image")) {
                return `<div class="relative group cursor-pointer mt-2" onclick="downloadImage('${msgContent}')">
                            <img src="${msgContent}" class="max-w-[200px] md:max-w-[280px] rounded-xl border border-slate-600 shadow-md">
                            <div class="absolute inset-0 bg-black/50 opacity-0 group-hover:opacity-100 transition-opacity rounded-xl flex items-center justify-center text-xs font-bold text-white tracking-widest backdrop-blur-sm">
                                💾 CLICK TO SAVE
                            </div>
                        </div>`;
            }
            return msgContent;
        }

        // --- 4. CLICK-TO-SAVE IMAGE ---
        function downloadImage(base64Str) {
            var a = document.createElement("a");
            a.href = base64Str;
            a.download = "Nexus_Secret_Image.png";
            a.click();
        }

        // --- BASIC CHAT LOGIC ---
        function handleKeyPress(event) {
            if (event.key === "Enter") sendMessage();
        }

        function sendTypingSignal() {
            ws.send(JSON.stringify({"type": "typing"}));
        }

        function sendMessage() {
            var input = document.getElementById("msgInput");
            if (input.value.trim() !== "") {
                ws.send(JSON.stringify({"type": "chat", "message": input.value}));
                input.value = "";
            }
        }

        function unsendMessage(msgId) {
            if (confirm("Are you sure you want to unsend this message?")) {
                ws.send(JSON.stringify({ "type": "unsend", "msg_id": msgId }));
            }
        }

        // --- WEBSOCKET EVENT RECEIVER ---
        ws.onmessage = function(event) {
            var data = JSON.parse(event.data);
            var messagesContainer = document.getElementById('messagesContainer');
            var typingIdc = document.getElementById('typingIndicator');
            
            if (data.type === "chat") {
                typingIdc.style.opacity = "0";
                var messageWrapper = document.createElement('div');
                messageWrapper.id = "msg-" + data.msg_id;
                
                // Format logic apply kora hocche (Image naki Text check korar jonno)
                var displayHTML = formatMessage(data.message);

                if (data.sender === myName) {
                    messageWrapper.className = "flex flex-col items-end mb-4 animate-fade-in-up cursor-pointer";
                    messageWrapper.ondblclick = function() { unsendMessage(data.msg_id); };
                    messageWrapper.innerHTML = `
                        <span class="text-[10px] text-cyan-400/70 mb-1 mr-2">${data.sender} (Double-click unsend)</span>
                        <div class="bg-gradient-to-br from-cyan-600 to-blue-700 text-white px-5 py-3 rounded-2xl rounded-tr-sm shadow-lg max-w-[80%] text-sm font-medium border border-cyan-500/30">
                            ${displayHTML}
                        </div>
                    `;
                } else {
                    messageWrapper.className = "flex flex-col items-start mb-4 animate-fade-in-up";
                    messageWrapper.innerHTML = `
                        <span class="text-[10px] text-slate-400 mb-1 ml-2">${data.sender}</span>
                        <div class="bg-slate-700/80 backdrop-blur-md text-slate-100 px-5 py-3 rounded-2xl rounded-tl-sm shadow-xl max-w-[80%] text-sm font-medium border border-slate-600/50">
                            ${displayHTML}
                        </div>
                    `;
                }
                messagesContainer.appendChild(messageWrapper);
                messagesContainer.scrollTop = messagesContainer.scrollHeight;
            } 
            else if (data.type === "unsend") {
                var msgElement = document.getElementById("msg-" + data.msg_id);
                if (msgElement) msgElement.remove();
            }
            else if (data.type === "typing") {
                if (data.sender !== myName) {
                    typingIdc.innerText = data.sender + " is typing...";
                    typingIdc.style.opacity = "1";
                    
                    clearTimeout(typingTimeout);
                    typingTimeout = setTimeout(function() { typingIdc.style.opacity = "0"; }, 1500);
                }
            }
            // --- SCREENSHOT ALERT UI ---
            else if (data.type === "screenshot") {
                if (data.sender !== myName) {
                    var alertWrapper = document.createElement('div');
                    alertWrapper.className = "flex justify-center mb-4 w-full animate-pulse";
                    alertWrapper.innerHTML = `
                        <div class="bg-red-900/50 border border-red-500 text-red-300 px-5 py-2 rounded-full text-xs font-bold tracking-widest shadow-[0_0_15px_rgba(239,68,68,0.5)] flex items-center gap-2">
                            🚨 ALERT: ${data.sender} just took a screenshot!
                        </div>
                    `;
                    messagesContainer.appendChild(alertWrapper);
                    messagesContainer.scrollTop = messagesContainer.scrollHeight;
                }
            }
            // --- LIVE PRESENCE UI ---
            else if (data.type === "presence") {
                if (data.sender !== myName) {
                    var pInd = document.getElementById('presenceIndicator');
                    var pDot = document.getElementById('presenceDot');
                    var pText = document.getElementById('presenceText');
                    if(pInd){
                        pInd.style.opacity = "1";
                        pText.innerText = data.sender + (data.status === "online" ? " is Online" : " left the chat");
                        if (data.status === "online") {
                            pDot.className = "w-3 h-3 rounded-full bg-emerald-400 shadow-[0_0_8px_rgba(52,211,153,0.8)] animate-pulse";
                        } else {
                            pDot.className = "w-3 h-3 rounded-full bg-red-500 shadow-[0_0_8px_rgba(239,68,68,0.8)]";
                        }
                    }
                }
            }
        };

        // --- HISTORY FETCHER ---
        function loadChatHistory() {
            fetch('http://127.0.0.1:8000/room/1/messages', {
                method: 'GET',
                headers: {
                    'Authorization': 'Bearer ' + myToken,
                    'Content-Type': 'application/json'
                }
            })
            .then(response => response.json())
            .then(data => {
                var messagesContainer = document.getElementById('messagesContainer');
                messagesContainer.innerHTML = ""; 
                
                data.forEach(chat => {
                    var messageWrapper = document.createElement('div');
                    messageWrapper.id = "msg-" + chat.msg_id;
                    
                    var displayHTML = formatMessage(chat.message);

                    if (chat.sender === myName) {
                        messageWrapper.className = "flex flex-col items-end mb-4 animate-fade-in-up cursor-pointer";
                        messageWrapper.ondblclick = function() { unsendMessage(chat.msg_id); };
                        messageWrapper.innerHTML = `
                            <span class="text-[10px] text-cyan-400/70 mb-1 mr-2">${chat.sender} (Double-click unsend)</span>
                            <div class="bg-gradient-to-br from-cyan-600 to-blue-700 text-white px-5 py-3 rounded-2xl rounded-tr-sm shadow-lg max-w-[80%] text-sm font-medium border border-cyan-500/30">
                                ${displayHTML}
                            </div>
                        `;
                    } else {
                        messageWrapper.className = "flex flex-col items-start mb-4 animate-fade-in-up";
                        messageWrapper.innerHTML = `
                            <span class="text-[10px] text-slate-400 mb-1 ml-2">${chat.sender}</span>
                            <div class="bg-slate-700/80 backdrop-blur-md text-slate-100 px-5 py-3 rounded-2xl rounded-tl-sm shadow-xl max-w-[80%] text-sm font-medium border border-slate-600/50">
                                ${displayHTML}
                            </div>
                        `;
                    }
                    messagesContainer.appendChild(messageWrapper);
                });
                messagesContainer.scrollTop = messagesContainer.scrollHeight;
            })
            .catch(error => console.error("History fetch error:", error));
        }

        loadChatHistory();
    </script>
</body>
</html>
